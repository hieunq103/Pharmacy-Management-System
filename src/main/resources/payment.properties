# ===================================================================
# CẤU HÌNH THANH TOÁN VIETQR & CỔNG TỰ ĐỘNG SEPAY
# ===================================================================

# 1. Thông tin tài khoản ngân hàng nhận tiền (VietQR NAPAS 247)
# KHÔNG ghi số tài khoản thật ở đây (file này nằm trong repo) — đặt PAYMENT_BANK_ID, PAYMENT_ACCOUNT_NO,
# PAYMENT_ACCOUNT_NAME trong file .env hoặc biến môi trường.
# Mã ngân hàng: MB, VCB, ACB, TCB, VPB, TPB, BIDV, CTG, VIB, STB, OCB, HDB...
payment.bank_id=
payment.account_no=
payment.account_name=

# 2. Cấu hình SePAY API (https://my.sepay.vn)
# Lấy API Token tại mục "Tích hợp API" -> "API Tokens"
# KHÔNG ghi token thật ở đây — đặt SEPAY_API_TOKEN trong .env hoặc biến môi trường.
sepay.api_token=
sepay.base_url=https://my.sepay.vn/userapi

# Thời gian kiểm tra biến động số dư (mili-giây, mặc định 2500ms = 2.5 giây)
sepay.poll_interval_ms=2000
