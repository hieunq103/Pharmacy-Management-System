# ============================================================
# Cấu hình ứng dụng PharmaOS
# Không commit mật khẩu thật lên git — dùng biến môi trường khi deploy production
# ============================================================

# ---- Database (mục 12.6 R50) ----
db.url=jdbc:mysql://localhost:3306/pharmacy_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
db.username=root
db.password=
db.pool.maxSize=10
db.pool.minIdle=2
db.pool.connectionTimeoutMs=5000
db.pool.maxLifetimeMs=1800000

# ---- Hibernate (đặt true khi cần đếm/xem câu SQL) ----
hibernate.show_sql=false
hibernate.format_sql=false
hibernate.generate_statistics=false
hibernate.jdbc.batch_size=50

# ---- Flyway ----
flyway.locations=classpath:db/migration
flyway.baselineOnMigrate=true

# ---- Auth (FR-01) ----
auth.maxFailedLoginAttempts=5
auth.lockoutMinutes=15
auth.sessionTimeoutMinutes=30
# Mật khẩu khởi tạo cho tài khoản mới — người dùng BẮT BUỘC đổi ở lần đăng nhập đầu tiên
auth.defaultPassword=12345678

# ---- Ứng dụng ----
app.version=0.1.0
app.timezone=Asia/Ho_Chi_Minh
